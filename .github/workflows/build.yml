name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, Win32]
        configuration: [Release]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        run: msbuild ViewReservation.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViewReservation-${{ matrix.platform }}-${{ matrix.configuration }}
          path: bin\${{ matrix.platform }}\${{ matrix.configuration }}\ViewReservation.tvtp
